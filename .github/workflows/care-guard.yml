name: Care Static Presentation Guard

on:
  # Temporarily avoid a failed runner-start notification on every main push.
  # Re-enable push only after the runner/job-start failure is diagnosed.
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: care-guard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-verification:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout read-only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Deterministic static site guard
        run: python3 tools/care_guard.py
      - name: Negative tests and edge cases
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
